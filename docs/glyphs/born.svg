<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 52 52" width="96" height="96" role="img" aria-label="squared magnitude">
<title>squared magnitude</title>
<style>.glt{fill:currentColor;font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-weight:700;stroke:rgba(5,8,22,.9);stroke-width:3.6px;paint-order:stroke;stroke-linejoin:round}
.gl-ic{fill:none;stroke:currentColor;stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round;opacity:.48}.gl-thin{stroke-width:1.6px}
.gl-faint{fill:none;stroke:currentColor;stroke-width:1.4px;opacity:.26}.gl-faint.gl-ic{opacity:.5}.gl-fill{fill:currentColor;opacity:.45;stroke:none}
.gl-fill-a{fill:#4f8cff;opacity:.5}.gl-fill-b{fill:#ff6b7d;opacity:.5}.gl-dot{fill:currentColor;opacity:.85}.gl-bar{stroke:currentColor;stroke-width:5px;stroke-linecap:round;opacity:.65;fill:none}
.gl-boxf{fill:rgba(120,80,200,.32);stroke:currentColor;stroke-width:2px}.gl-boxs{fill:rgba(120,80,200,.16);stroke:currentColor;stroke-width:1.4px;opacity:.8}
.gl-pic{fill:none;stroke:currentColor;stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="-6" y="-6" width="52" height="52" rx="7" fill="#0d1430"/>
<g color="#4f8cff" style="color:#4f8cff"><rect x="4" y="4" width="32" height="32" rx="2" class="gl-ic gl-thin"/><path d="M30 4v6h6" class="gl-faint"/><text x="18" y="30.5" font-size="26" text-anchor="middle" class="glt">α</text><text x="33" y="15" font-size="13" text-anchor="middle" class="glt">2</text></g>
</svg>
